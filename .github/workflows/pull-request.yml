name: Pull Request Check
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "**/*.gitignore"
      - .editorconfig
      - docs/**
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          install: false
          cache: true
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          check-latest: true
          package-manager-cache: false
      - run: pnpm config set --location=global minimumReleaseAge 0
      - run: pnpm install
      #   run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test
